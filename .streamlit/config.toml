# Thème : clair ou sombre selon le réglage du téléphone / PC de l'utilisateur
[theme]
primaryColor = "#5aa55a"
font = "sans-serif"

[theme.light]
primaryColor = "#5aa55a"
backgroundColor = "#eef6ea"
secondaryBackgroundColor = "#ffffff"
textColor = "#18261a"

[theme.dark]
primaryColor = "#86cc82"
backgroundColor = "#0f1a11"
secondaryBackgroundColor = "#1a291c"
textColor = "#e8f2e5"

[server]
# Taille maximale d'un export Kobo chargé via « ⚙ Paramètres » (Mo)
maxUploadSize = 200

[client]
# Masque le menu développeur pour les utilisateurs
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
